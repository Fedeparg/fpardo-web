services:
  fpardo-web:
    build: .
    image: fpardo-web:latest
    container_name: fpardo-web
    restart: unless-stopped
    networks:
      - services_net
    ports:
      - "8081:3000"
    environment:
      - TZ=Europe/Paris
      - NOTION_TOKEN=${NOTION_TOKEN}

networks:
  services_net:
    external: true
